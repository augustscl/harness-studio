# In-box plugins for Harness Studio.
# Applied by the desktop shell via `dsh web --patch <this file>`; packages
# live beside this file under node_modules/@harness/.
- insert:
    - id: file-upload
      name: '@harness/file-upload'
    - id: dsh-skin
      name: '@harness/dsh-skin'
    - id: artifact-studio
      name: '@harness/artifact-studio'
    - id: studio-ux
      name: '@harness/studio-ux'
    - id: desktop-services
      name: '@harness/desktop-services'
    - id: dsh-market
      name: 'dshmarket'
