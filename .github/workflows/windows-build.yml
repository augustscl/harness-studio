name: build-windows

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (builds node-pty natively)
        run: npm install
      - name: Build Windows installer
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: harness-studio-windows-x64
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
